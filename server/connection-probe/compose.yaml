# Probe-only project. Not the AxFluxo production compose file.
# Local compose fixture only. Blitz import/part mapping and kept-folder sharing are unverified.
x-env: &env
  PROBE_RUN_ID: ${PROBE_RUN_ID:?Set a new UUID for this isolated run}
  PROBE_DATABASE_NAME: ${PROBE_DATABASE_NAME:?Explicit actual dedicated database name}
  PROBE_DEDICATED_DATABASE: ${PROBE_DEDICATED_DATABASE:?Confirm new-empty-probe-only}
  PROBE_TOKEN: ${PROBE_TOKEN:?Private probe UI bearer token}
  PROBE_INTERNAL_KEY: ${PROBE_INTERNAL_KEY:?Private internal HMAC key}
  PROBE_ROOT: /probe-data
  # Let a provider inject DATABASE_URL instead if appropriate. Do not point at AxFluxo's DB.
  PROBE_DATABASE_URL: ${PROBE_DATABASE_URL:?New dedicated probe database only}
  PROBE_DB_TLS: "true"
services:
  api:
    build:
      context: ../..
      dockerfile: server/connection-probe/Dockerfile.api
    environment:
      <<: *env
      PORT: "8080"
      PROBE_PUBLIC_ORIGIN: ${PROBE_PUBLIC_ORIGIN:?Exact HTTPS probe origin}
      PROBE_WORKER_ORIGIN: ${PROBE_WORKER_ORIGIN:-}
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["probe-data:/probe-data"]
    read_only: true
    mem_limit: 128m
    pids_limit: 32
    stop_grace_period: 15s
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  worker:
    build:
      context: ../..
      dockerfile: server/connection-probe/Dockerfile.worker
    environment:
      <<: *env
      PROBE_INTERNAL_PORT: "8091"
    expose: ["8091"]
    volumes: ["probe-data:/probe-data"]
    read_only: true
    mem_limit: 128m
    pids_limit: 32
    stop_grace_period: 15s
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  probe-data:
