name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
# Publishable values only. Variables override these public project defaults.
env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://nbyigfqkweodzlhwdryz.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_EFXWNrd_UcG6To3sI5IlyA_Abuc1Hij' }}
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Ensure local media probe tools
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: npm test
      - run: npm run build
      - run: npm run build:deletion --workspace server && npm run build:notifications --workspace server
      - run: npx playwright install --with-deps chromium chrome webkit
      - run: npm run test:video:browser
      - run: |
          node scripts/serve.mjs > /tmp/axfluxo-server.log 2>&1 &
          static_pid=$!
          trap 'kill "$static_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:3000/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
          kill "$static_pid"
          wait "$static_pid" || true
          NEXT_PUBLIC_BASE_PATH=/axfluxo npm run build
          NEXT_PUBLIC_BASE_PATH=/axfluxo node scripts/serve.mjs > /tmp/axfluxo-base-server.log 2>&1 &
          static_pid=$!
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:3000/axfluxo/ > /dev/null; then break; fi
            sleep 1
          done
          PLAYWRIGHT_BASE_URL=http://localhost:3000/axfluxo/ npm run test:e2e
      - name: Developer access ON matrix (mock API only; never published)
        env:
          NEXT_PUBLIC_DEVELOPER_STUDIO_ENABLED: "true"
          NEXT_PUBLIC_ALL_VERSIONS_ENABLED: "true"
          NEXT_PUBLIC_FNF_SHOWCASE_ENABLED: "true"
          NEXT_PUBLIC_VIDEO_PREVIEW_ENABLED: "true"
          NEXT_PUBLIC_VIDEO_API_ORIGIN: https://developer-api.test
        run: |
          for base in '' '/axfluxo'; do
            NEXT_PUBLIC_BASE_PATH="$base" npm run build
            NEXT_PUBLIC_BASE_PATH="$base" PORT=3172 node scripts/serve.mjs > /tmp/developer-access.log 2>&1 &
            developer_pid=$!
            trap 'kill "$developer_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 30); do
              if curl --fail "http://127.0.0.1:3172$base/" > /dev/null; then break; fi
              sleep 1
            done
            PLAYWRIGHT_BASE_URL="http://127.0.0.1:3172$base/" npm run test:developer:published
            kill "$developer_pid"
            wait "$developer_pid" || true
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
