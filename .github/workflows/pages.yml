name: Publish GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Publishable values only. Variables override these public project defaults.
env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://nbyigfqkweodzlhwdryz.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_EFXWNrd_UcG6To3sI5IlyA_Abuc1Hij' }}
  NEXT_PUBLIC_DEVELOPER_STUDIO_ENABLED: ${{ vars.NEXT_PUBLIC_DEVELOPER_STUDIO_ENABLED || 'false' }}
  NEXT_PUBLIC_ALL_VERSIONS_ENABLED: ${{ vars.NEXT_PUBLIC_ALL_VERSIONS_ENABLED || 'false' }}
  NEXT_PUBLIC_FNF_SHOWCASE_ENABLED: ${{ vars.NEXT_PUBLIC_FNF_SHOWCASE_ENABLED || 'false' }}
  NEXT_PUBLIC_VIDEO_PREVIEW_ENABLED: ${{ vars.NEXT_PUBLIC_VIDEO_PREVIEW_ENABLED || 'false' }}
  NEXT_PUBLIC_VIDEO_API_ORIGIN: ${{ vars.NEXT_PUBLIC_VIDEO_API_ORIGIN }}
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_BASE_PATH: /axfluxo
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000/axfluxo/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify Supabase before publishing
        run: node scripts/check-auth.mjs
      - run: npm run typecheck
      - run: npm run lint
      - name: Ensure local media probe tools
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: npm test
      - name: Build unchanged OFF regression artifact
        run: NEXT_PUBLIC_VIDEO_API_ORIGIN= NEXT_PUBLIC_DEVELOPER_STUDIO_ENABLED=false NEXT_PUBLIC_ALL_VERSIONS_ENABLED=false NEXT_PUBLIC_FNF_SHOWCASE_ENABLED=false NEXT_PUBLIC_VIDEO_PREVIEW_ENABLED=false npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test the Pages artifact at its production subpath
        run: |
          node scripts/serve.mjs > /tmp/axfluxo-server.log 2>&1 &
          regression_pid=$!
          trap 'kill "$regression_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail "$PLAYWRIGHT_BASE_URL" > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pages-playwright-results
          path: test-results/
      - name: Check real authorization API before enabling the entry
        run: node scripts/check-developer-api.mjs
      - name: Build configured Pages artifact
        run: npm run build
      - name: Check access on the configured artifact
        run: |
          node scripts/serve.mjs > /tmp/axfluxo-configured-server.log 2>&1 &
          configured_pid=$!
          trap 'kill "$configured_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail "$PLAYWRIGHT_BASE_URL" > /dev/null; then break; fi
            sleep 1
          done
          npm run test:developer:published
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify live Supabase public authentication settings
        run: node scripts/check-auth.mjs
      - name: Verify live developer authorization API
        run: node scripts/check-developer-api.mjs
      - name: Verify the public HTTPS site
        run: |
          if [ "$NEXT_PUBLIC_DEVELOPER_STUDIO_ENABLED" = true ] || [ -n "$NEXT_PUBLIC_VIDEO_API_ORIGIN" ]; then
            npm run test:developer:published
          else
            npm run test:e2e
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-pages-test-results
          path: test-results/
